name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    # README 承诺 Python 3.8+；跨版本跑可拦截「本地 3.13 能过、3.11 语法报错」这类问题。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate SKILL.md (frontmatter, name, description, examples ≤ 3)
        run: python scripts/quick_validate.py .
      - name: Check inline JS syntax in all templates
        run: python scripts/check_js.py
      - name: End-to-end smoke test
        run: python scripts/smoke_test.py
      - name: Build package zip (sync version + forward-slash paths)
        if: matrix.python-version == '3.11'
        run: python scripts/package.py --output proust-questionnaire.zip
      - name: Verify zip structure
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import zipfile
          n = zipfile.ZipFile("proust-questionnaire.zip").namelist()
          assert n[0].startswith("proust-questionnaire/"), n[0]
          assert all("\\" not in x for x in n), "backslash found in zip path"
          assert not any("/." in x for x in n), "dotfile leaked into zip"
          print("zip OK:", len(n), "entries, top:", n[0].split('/')[0])
          PY
